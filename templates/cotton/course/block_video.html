{% load md %}
<c-vars block="" />

<c-course.block-frame icon="🎬" tone="red">
  <c-slot name="title">{{ block.title|furigana|default:"Vidéo" }}</c-slot>
  <c-slot name="footer">{{ slot }}</c-slot>
    <div class="p-6 bg-white space-y-4">
      <div class="bg-black rounded-xl overflow-hidden shadow-sm aspect-video w-full max-w-4xl mx-auto">
        <iframe src="https://www.youtube.com/embed/{{ block.video_id }}?rel=0&modestbranding=1"
                class="w-full h-full border-0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                loading="lazy"
                allowfullscreen>
        </iframe>
      </div>
    </div>
  
</c-course.block-frame>
