{# Champ de code promo : l'aperçu du prix (slot) est rafraîchi par HTMX à chaque saisie. #}
<c-vars course="" name="promo_code" />

<c-ui.card variant="muted" padding="sm">
  <c-form.label>Avez-vous un code promo ?</c-form.label>
  <input type="text" name="{{ name }}"
         placeholder="Ex: PROMO20"
         hx-post="{% url 'validate_coupon' course.id %}"
         hx-target="#price-result"
         hx-trigger="keyup delay:500ms changed"
         class="w-full px-4 py-2.5 border border-gray-300 rounded-xl bg-white text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-transparent transition text-sm">
</c-ui.card>

<div id="price-result">{{ slot }}</div>
