{% extends "base.html" %}

{% block title %}Vérifiez votre e-mail — Hajime Learning{% endblock %}

{% block content %}
<c-layout.auth-card title="Vérifiez votre boîte e-mail"
  subtitle="Un e-mail de vérification vient de vous être envoyé.">

  <div class="text-center py-4">
    <div class="mx-auto w-16 h-16 rounded-full bg-orange-50 flex items-center justify-center mb-6">
      <svg class="w-8 h-8 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
      </svg>
    </div>

    <p class="text-sm text-gray-600 leading-relaxed">
      Cliquez sur le lien dans l'e-mail pour activer votre compte.
      <br class="hidden sm:block">
      Si vous ne le trouvez pas, vérifiez vos <strong class="text-gray-700">courriers indésirables</strong>.
    </p>
  </div>

  <div class="mt-6 pt-6 border-t border-gray-100 text-center">
    <c-ui.btn href="{% url 'account_login' %}" variant="outline" class="w-full justify-center">
      Retour à la connexion
    </c-ui.btn>
  </div>

</c-layout.auth-card>
{% endblock %}
