{# Cadre repliable commun à tous les blocs de leçon. Le corps du bloc est le slot par défaut ; le titre est le slot « title ». #}
<c-vars icon="" tone="yellow" />

<div x-data="collapsibleBlock"
     class="border border-gray-300 rounded-2xl bg-white shadow-soft overflow-hidden manga-drawn" {{ attrs }}>

  <button x-on:click="open = !open"
          class="w-full flex items-center justify-between px-5 py-4 text-left cursor-pointer transition-colors focus:outline-none select-none"
          :class="open ? 'bg-gray-50/70 border-b border-gray-200' : 'bg-white hover:bg-gray-50/60'">
    <div class="flex items-center gap-3.5 min-w-0 pr-3">
      <span class="flex items-center justify-center w-8 h-8 border border-gray-900 rounded-lg text-sm font-bold shrink-0 shadow-xs
                   {% if tone == 'yellow' %}bg-yellow-400 text-gray-950
                   {% elif tone == 'red' %}bg-red-100 text-red-600
                   {% elif tone == 'blue' %}bg-blue-100 text-blue-600
                   {% elif tone == 'purple' %}bg-purple-100 text-purple-700
                   {% elif tone == 'indigo' %}bg-indigo-100 text-indigo-700
                   {% elif tone == 'emerald' %}bg-emerald-100 text-emerald-700{% endif %}">
        {{ icon }}
      </span>
      <h3 class="text-base sm:text-lg font-bold text-gray-900 truncate">{{ title }}</h3>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <span class="text-xs font-semibold text-gray-500 hidden sm:inline" x-text="open ? 'Replier' : 'Déplier'"></span>
      <div class="w-7 h-7 rounded-lg border border-gray-200 flex items-center justify-center bg-white text-gray-500">
        <svg class="w-4 h-4 transition-transform duration-200" :class="open && 'rotate-180'"
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>
    </div>
  </button>

  <div x-show="open" x-collapse>
    {{ slot }}
  </div>
</div>
