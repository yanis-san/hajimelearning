{% load md %}
<c-vars block="" />

<div x-data="{ open: true }"
     @expand-all-blocks.window="open = true"
     @collapse-all-blocks.window="open = false" {{ attrs }}>
  <button x-on:click="open = !open"
          class="w-full flex items-center justify-between py-2 text-left cursor-pointer group">
    <h3 class="text-lg font-semibold text-gray-800 group-hover:text-orange-600 transition">
      {% if block.title %}{{ block.title }}{% else %}{{ block.text_content|first_heading }}{% endif %}
    </h3>
    <svg class="w-4 h-4 text-gray-400 shrink-0 transition-transform duration-200"
         :class="open && 'rotate-180'"
         fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
    </svg>
  </button>
  <div x-show="open" x-collapse>
    <div class="prose prose-gray max-w-none prose-headings:text-gray-800 prose-a:text-orange-600 prose-a:no-underline hover:prose-a:underline prose-img:rounded-xl py-1">
      {% if block.title %}
        {{ block.text_content|md }}
      {% else %}
        {{ block.text_content|strip_first_heading|md }}
      {% endif %}
    </div>
  </div>
</div>
