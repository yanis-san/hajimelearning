{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto py-10 px-4">

  <c-ui.page-header title="🎫 Mes Questions" subtitle="Support & aide pédagogique">
    <c-ui.btn variant="outline" size="sm" href="{% url 'user_dashboard' %}">
      ← Retour au Dashboard
    </c-ui.btn>
  </c-ui.page-header>

  {# Onglets En cours / Résolues #}
  <div x-data="{ tab: 'pending' }" class="space-y-6">

    <div class="flex rounded-lg bg-gray-100 p-0.5 w-fit">
      <button type="button"
              x-on:click="tab = 'pending'"
              :class="tab === 'pending' ? 'bg-white shadow-sm text-gray-800' : 'text-gray-500 hover:text-gray-700'"
              class="px-4 py-2 text-sm font-medium rounded-md transition cursor-pointer">
        ⏳ En cours ({{ pending.count }})
      </button>
      <button type="button"
              x-on:click="tab = 'resolved'"
              :class="tab === 'resolved' ? 'bg-white shadow-sm text-gray-800' : 'text-gray-500 hover:text-gray-700'"
              class="px-4 py-2 text-sm font-medium rounded-md transition cursor-pointer">
        ✅ Résolues ({{ resolved.count }})
      </button>
    </div>

    {# En cours #}
    <div x-show="tab === 'pending'" x-transition class="space-y-3">
      {% for q in pending %}
        <c-support.question-card :question="q" />
      {% empty %}
        <c-ui.empty-state icon="💬" title="Aucune question en cours" message="Vous n'avez aucune question ouverte pour le moment." />
      {% endfor %}
    </div>

    {# Résolues #}
    <div x-show="tab === 'resolved'" x-transition class="space-y-3">
      {% for q in resolved %}
        <c-support.question-card :question="q" />
      {% empty %}
        <c-ui.empty-state icon="✅" title="Aucune question résolue" message="Vos questions résolues apparaîtront ici." />
      {% endfor %}
    </div>

  </div>
</div>
{% endblock %}
