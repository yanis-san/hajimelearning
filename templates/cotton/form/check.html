{# Case à cocher avec libellé en ligne. `checked` : "true" pour cocher. #}
<c-vars name="" checked="false" />

<label class="flex items-center gap-1.5 text-sm text-gray-600" {{ attrs }}>
  <input type="checkbox" name="{{ name }}" {% if checked == 'true' %}checked{% endif %}
         class="rounded border-gray-300 text-primary focus:ring-primary/40">
  {{ slot }}
</label>
