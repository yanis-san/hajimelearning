<c-vars title="" subtitle="" />

<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12 bg-primary relative overflow-hidden border-b-2 border-primary-dark">
  
  <!-- Manga Halftone background -->
  <div class="absolute inset-0 opacity-10 pointer-events-none mix-blend-multiply halftone"></div>

  <div class="w-full max-w-md relative z-10">

    {# Logo / Marque #}
    <div class="text-center mb-8 flex justify-center">
      <c-ui.logo size="lg" dark="true" class="text-white drop-shadow-sm hover:-translate-y-1" />
    </div>

    {# Carte #}
    <div class="relative group">
        <c-ui.card padding="none" drawn="true" class="relative px-8 py-10 z-10 transition-transform duration-300">

          {% if title %}
            <div class="mb-8 border-b-2 border-gray-100 pb-4">
              <c-ui.title size="lg">{{ title }}</c-ui.title>
              {% if subtitle %}
                <p class="text-sm font-medium text-gray-500 mt-2">{{ subtitle }}</p>
              {% endif %}
            </div>
          {% endif %}

          {{ slot }}

        </c-ui.card>
    </div>

  </div>
</div>
