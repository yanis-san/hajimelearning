<div id="notification-badge"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% if unread_count > 0 %}
    <span class="absolute -top-1 -right-1 inline-flex items-center justify-center min-w-[1.2rem] h-5 px-1 text-xs font-bold text-white bg-primary rounded-full border-2 border-white shadow-sm">
      {{ unread_count }}
    </span>
  {% endif %}
</div>
