<c-vars response="" />

<div class="bg-white rounded-xl p-5 border shadow-sm
            {% if response.is_instructor %}border-orange-200{% else %}border-gray-200{% endif %}">

  {# Author header #}
  <div class="flex items-center justify-between mb-3">
    <div class="flex items-center gap-2.5">
      <c-ui.avatar :user="response.author" size="sm" />
      <div class="flex items-center gap-2">
        {% if response.is_instructor %}
          <span class="text-sm font-semibold text-orange-600">🎓 Équipe Hajime</span>
        {% else %}
          <span class="text-sm font-medium text-gray-800">{{ response.author.first_name|default:response.author.email }}</span>
        {% endif %}
      </div>
    </div>
    <span class="text-xs text-gray-400">{{ response.created_at|timesince }}</span>
  </div>

  {# Content #}
  <div class="text-sm text-gray-700 leading-relaxed">
    {{ response.content|linebreaks }}
  </div>
</div>
