<c-ui.card variant="soft" padding="sm" class="mt-3 border-l-4 border-primary/60 rounded-r-xl" x-data>
  <h4 class="text-xs font-semibold uppercase text-primary-dark mb-3 tracking-wide">Nouvelle Question</h4>

  <form hx-post="{% url 'add_quiz_question' block.id %}" hx-target="#quiz-questions-{{ block.id }}">
    {% csrf_token %}

    {# Question + Duration #}
    <div class="flex gap-4 mb-3">
      <c-form.field :field="form.question_text" label="La Question" variant="compact" class="flex-grow" />
      <c-form.field :field="form.duration" label="⏱️ Sec" variant="compact" class="w-24" />
    </div>

    {# Choices grid #}
    <div class="grid grid-cols-2 gap-2 mb-3">
      <c-form.field :field="form.choice_a" label="Choix A" variant="compact" />
      <c-form.field :field="form.choice_b" label="Choix B" variant="compact" />
      <c-form.field :field="form.choice_c" label="Choix C" variant="compact" />
      <c-form.field :field="form.choice_d" label="Choix D" variant="compact" />
    </div>

    {# Correct answer + explanation #}
    <div class="grid grid-cols-2 gap-4 mb-3 bg-gray-50 p-3 rounded-xl">
      <c-form.field :field="form.correct_answer" label="Bonne Réponse" variant="compact" />
      <c-form.field :field="form.explanation" label="Explication (si erreur)" variant="compact" />
    </div>

    {# Actions #}
    <div class="flex justify-end gap-2 mt-2 pt-2 border-t border-gray-100">
      <c-ui.btn variant="ghost" size="sm" type="button"
                x-on:click="$el.closest('.mt-3').remove()">
        Annuler
      </c-ui.btn>
      <c-ui.btn variant="primary" size="sm" type="submit">
        Enregistrer la question
      </c-ui.btn>
    </div>
  </form>
</c-ui.card>
