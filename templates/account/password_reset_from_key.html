{% extends "base.html" %}

{% block title %}Nouveau mot de passe — Hajime Learning{% endblock %}

{% block content %}
<c-layout.auth-card title="Nouveau mot de passe" subtitle="Choisissez un mot de passe fort.">

  {% if token_fail %}
    <c-ui.alert variant="error" title="Lien invalide ou expiré">
      Ce lien de réinitialisation n'est plus valide.
    </c-ui.alert>
    <div class="mt-4">
      <c-ui.btn href="{% url 'account_reset_password' %}" variant="outline" class="w-full justify-center">
        Redemander un lien
      </c-ui.btn>
    </div>
  {% else %}
    <form method="POST" action="{{ action_url }}" class="space-y-4">
      {% csrf_token %}

      <c-form.input name="password1" type="password" label="Nouveau mot de passe"
        placeholder="••••••••"
        :error="form.password1.errors.0" required="true" />
      <c-form.input name="password2" type="password" label="Confirmer le mot de passe"
        placeholder="••••••••"
        :error="form.password2.errors.0" required="true" />

      <div class="pt-2">
        <c-ui.btn type="submit" class="w-full justify-center">Changer le mot de passe</c-ui.btn>
      </div>
    </form>
  {% endif %}

</c-layout.auth-card>
{% endblock %}
