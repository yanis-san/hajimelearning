{% load static %}
<!DOCTYPE html>
<html lang="fr" class="min-h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FAF8F5">

    <title>{% block title %}Hajime Learning - Apprenez en ligne{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}La meilleure plateforme de formation en Algérie.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}formation, ligne, algérie, cours, python, dev{% endblock %}">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}Hajime Learning{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Formez-vous dès aujourd'hui.{% endblock %}">
    {% block og_image %}{# <meta property="og:image" content="{% static 'img/og-default.jpg' %}"> #}{% endblock %}
    <meta property="og:url" content="{{ request.build_absolute_uri }}">

    {# <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any"> #}
    <link href="{% static 'css/dist/styles.css' %}" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">

    <script src="{% static 'js/htmx.min.js' %}"></script>
    <script defer src="{% static 'js/alpine.min.js' %}"></script>

    <style>
        [x-cloak] { display: none !important; }
        .manga-drawn {
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px !important;
        }
        .manga-drawn-alt {
            border-radius: 15px 255px 15px 225px/225px 15px 255px 15px !important;
        }

        /* ── Furigana / Ruby Typography ── */
        ruby {
            ruby-position: over;
            -webkit-ruby-position: over;
            ruby-align: center;
            line-height: 1.85;
        }
        rt {
            font-size: 0.58em;
            line-height: 1.1;
            font-weight: 600;
            text-align: center;
            color: #000000;
            opacity: 1;
            letter-spacing: 0.02em;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            font-family: 'Klee One', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
        }
        :is(.text-white, .text-gray-100, .text-gray-200, .text-gray-300, .bg-gray-900, .bg-gray-950, .bg-black, [class*="bg-gray-900"], [class*="bg-gray-950"], [class*="bg-dark"]) rt {
            color: #ffffff;
        }
        :where(p, li, h1, h2, h3, h4, h5, td, th, blockquote):has(ruby) {
            line-height: 2.2 !important;
        }
        .prose :where(p, li, h1, h2, h3, h4):has(ruby) {
            line-height: 2.25 !important;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body class="min-h-screen flex flex-col font-sans text-dark antialiased"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <c-layout.navbar />

    <c-layout.flash-messages />

    <main class="flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <c-layout.footer />

    {% block extra_js %}{% endblock %}
</body>
</html>
