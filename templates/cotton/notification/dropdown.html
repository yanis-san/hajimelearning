<c-vars notifications="" unread_count="0" />

<div x-data="{ open: false }" class="relative" {{ attrs }}>

  {# Bouton cloche #}
  <button @click="open = !open"
          class="relative p-2 rounded-xl text-gray-500 hover:text-orange-600 hover:bg-orange-50 transition focus:outline-none focus:ring-2 focus:ring-orange-400 cursor-pointer">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
    </svg>
    <div id="notification-badge">
      {% if unread_count > 0 %}
        <span class="absolute top-1 right-1 inline-flex items-center justify-center w-4 h-4 text-xs font-bold leading-none text-white bg-red-500 rounded-full border-2 border-white">
          {{ unread_count }}
        </span>
      {% endif %}
    </div>
  </button>

  {# Dropdown panel #}
  <div x-show="open"
       @click.outside="open = false"
       x-transition:enter="transition ease-out duration-150"
       x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
       x-transition:enter-end="opacity-100 scale-100 translate-y-0"
       x-transition:leave="transition ease-in duration-100"
       x-transition:leave-start="opacity-100 scale-100 translate-y-0"
       x-transition:leave-end="opacity-0 scale-95 -translate-y-1"
       x-cloak
       class="absolute right-0 mt-2 w-80 bg-white rounded-2xl shadow-xl border border-gray-100 z-50 overflow-hidden origin-top-right"
       id="notification-dropdown-panel">

    {# En-tête #}
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 bg-gray-50/60">
      <h3 class="text-sm font-semibold text-gray-800">Notifications</h3>
      <a href="{% url 'my_notifications' %}" class="text-xs text-orange-500 hover:text-orange-700 font-medium transition">
        Tout voir
      </a>
    </div>

    {# Liste #}
    <div class="max-h-80 overflow-y-auto divide-y divide-gray-100">
      {% if notifications %}
        {% for notif in notifications %}
          <c-notification.item :notif="notif" compact="true" />
        {% endfor %}
      {% else %}
        <div class="px-4 py-10 text-center">
          <svg class="w-8 h-8 text-gray-300 mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <p class="text-sm text-gray-400">Aucune notification</p>
        </div>
      {% endif %}
    </div>

    {# Pied de dropdown — action "tout lire" #}
    {% if unread_count > 0 %}
      <div class="border-t border-gray-100 bg-gray-50/60 p-2">
        <button type="button"
                hx-post="{% url 'mark_all_read' %}"
                hx-headers='{"X-Source": "dropdown"}'
                hx-target="#notification-dropdown-panel"
                hx-swap="innerHTML"
                class="w-full text-xs text-gray-500 hover:text-orange-600 font-medium py-1.5 rounded-lg hover:bg-orange-50 transition cursor-pointer focus:outline-none focus:ring-2 focus:ring-inset focus:ring-orange-400">
          Tout marquer comme lu
        </button>
      </div>
    {% endif %}
  </div>
</div>
