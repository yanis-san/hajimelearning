<c-vars variant="gray" />

<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
             {% if variant == 'green' %}bg-green-100 text-green-800
             {% elif variant == 'red' %}bg-red-100 text-red-800
             {% elif variant == 'blue' %}bg-blue-100 text-blue-800
             {% elif variant == 'orange' %}bg-orange-100 text-orange-700
             {% elif variant == 'yellow' %}bg-yellow-100 text-yellow-800
             {% else %}bg-gray-100 text-gray-600{% endif %}"
     {{ attrs }}>{{ slot }}</span>
