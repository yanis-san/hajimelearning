<c-vars name="" type="text" label="" placeholder="" value="" error="" required="false" help_text="" />

<div class="space-y-1">
  {% if label %}
    <label for="{{ name }}" class="block text-sm font-bold text-gray-700">
      {{ label }}{% if required == 'true' %}<span class="text-primary ml-1">*</span>{% endif %}
    </label>
  {% endif %}

  {% if type == 'password' %}
    <div x-data="{ show: false }" class="relative">
      <input :type="show ? 'text' : 'password'"
             id="{{ name }}"
             name="{{ name }}"
             placeholder="{{ placeholder }}"
             {% if value %}value="{{ value }}"{% endif %}
             {% if required == 'true' %}required{% endif %}
             class="w-full px-4 py-3 border-2 rounded-xl text-gray-900 placeholder-gray-500 bg-gray-50 focus:bg-white focus:outline-none focus:ring-0 transition-colors pr-12
                    {% if error %}border-primary{% else %}border-gray-200 focus:border-gray-900{% endif %}"
             {{ attrs }}>
      <button type="button" @click="show = !show"
              class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-gray-500 hover:text-gray-900 transition-colors focus:outline-none">
        <svg x-show="!show" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
        <svg x-show="show" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/>
        </svg>
      </button>
    </div>

  {% elif type == 'file' %}
    <label for="{{ name }}"
           class="flex items-center gap-3 px-4 py-3 border-2 border-dashed bg-gray-50 rounded-xl cursor-pointer transition-colors group
                  {% if error %}border-primary{% else %}border-gray-200 hover:border-gray-900{% endif %}">
      <div class="p-2 bg-white text-gray-900 border-2 border-gray-200 rounded-lg group-hover:bg-gray-100 transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
      </div>
      <span class="text-sm font-bold text-gray-700 group-hover:text-gray-900 transition-colors">Choisir un fichier…</span>
      <input id="{{ name }}" name="{{ name }}" type="file"
             {% if required == 'true' %}required{% endif %}
             class="sr-only" {{ attrs }}>
    </label>

  {% else %}
    <input type="{{ type }}"
           id="{{ name }}"
           name="{{ name }}"
           placeholder="{{ placeholder }}"
           {% if value %}value="{{ value }}"{% endif %}
           {% if required == 'true' %}required{% endif %}
           class="w-full px-4 py-3 border-2 rounded-xl text-gray-900 placeholder-gray-500 bg-gray-50 focus:bg-white focus:outline-none focus:ring-0 transition-colors
                  {% if error %}border-primary{% else %}border-gray-200 focus:border-gray-900{% endif %}"
           {{ attrs }}>
  {% endif %}

  {% if help_text and not error %}
    <p class="text-xs text-gray-500 font-medium mt-1">{{ help_text }}</p>
  {% endif %}

  {% if error %}
    <p class="text-sm font-bold text-primary mt-1 flex items-center gap-1">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
        {{ error }}
    </p>
  {% endif %}
</div>
