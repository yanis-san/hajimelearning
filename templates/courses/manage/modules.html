{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
  <script src="{% static 'js/vendor/sortable.min.js' %}"></script>
  <script src="{% static 'js/builder/sortable-init.js' %}"></script>
{% endblock %}

{% block content %}
<c-layout.course_builder :course="course" active_tab="modules">

  {# ── Add module form ── #}
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 mb-8">
    <form hx-post="{% url 'manage_course_modules' course.slug %}"
          hx-target="#module-list"
          hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful) this.reset()"
          class="flex items-center gap-3">
      {% csrf_token %}
      <div class="flex-grow">
        {{ form.title }}
      </div>
      <c-ui.btn variant="primary" type="submit">
        ➕ Ajouter un module
      </c-ui.btn>
    </form>
  </div>

  {# ── Module list (sortable) ── #}
  <div class="sortable-list space-y-3" id="module-list"
       hx-post="{% url 'manage_module_reorder' course.slug %}"
       hx-trigger="end"
       hx-target="#reorder-msg">

    {% include 'courses/manage/partials/module_list.html' %}

  </div>

  <div id="reorder-msg"></div>


</c-layout.course_builder>
{% endblock %}
