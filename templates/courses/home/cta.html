{% if not user.is_authenticated %}
<section class="bg-primary text-white py-24 border-b-2 border-primary-dark relative overflow-hidden">
    <div class="absolute inset-0 opacity-[0.03] pointer-events-none halftone"></div>
    
    <div class="max-w-4xl mx-auto px-6 text-center relative z-10">
        <h2 class="text-4xl md:text-6xl font-extrabold tracking-tight italic mb-6 drop-shadow-sm">
            Prêt à commencer l'aventure ?
        </h2>
        <p class="text-lg md:text-xl font-medium text-white/90 mb-10 max-w-2xl mx-auto">

        </p>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-6">
            <a href="{% url 'account_signup' %}" class="w-full sm:w-auto bg-white text-gray-900 font-bold rounded-xl px-8 py-3.5 border-2 border-gray-900 shadow-[4px_4px_0_0_#111827] hover:-translate-y-0.5 hover:shadow-[5px_5px_0_0_#111827] active:translate-y-0.5 transition-all text-center">
                Créer mon compte
            </a>
            <a href="{% url 'contact' %}" class="w-full sm:w-auto bg-transparent text-white font-bold rounded-xl px-8 py-3.5 border-2 border-white hover:bg-white hover:text-gray-900 transition-all text-center">

            </a>

    </div>
