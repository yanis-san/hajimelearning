<c-vars title="" subtitle="" />

<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8" {{ attrs }}>
  <div>
    <h1 class="text-2xl font-bold text-gray-900 tracking-tight">{{ title }}</h1>
    {% if subtitle %}
      <p class="mt-1 text-sm text-gray-500">{{ subtitle }}</p>
    {% endif %}
  </div>
  {% if slot %}
    <div class="flex items-center gap-3 shrink-0">{{ slot }}</div>
  {% endif %}
</div>
