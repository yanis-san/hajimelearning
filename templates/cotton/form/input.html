<c-vars name="" type="text" label="" placeholder="" value="" error="" required="false" help_text="" />

<div class="space-y-1">
  {% if label %}
    <label for="{{ name }}" class="block text-sm font-medium text-gray-700">
      {{ label }}{% if required == 'true' %}<span class="text-red-500 ml-0.5">*</span>{% endif %}
    </label>
  {% endif %}

  {% if type == 'password' %}
    <div x-data="{ show: false }" class="relative">
      <input :type="show ? 'text' : 'password'"
             id="{{ name }}"
             name="{{ name }}"
             placeholder="{{ placeholder }}"
             {% if value %}value="{{ value }}"{% endif %}
             {% if required == 'true' %}required{% endif %}
             class="w-full px-4 py-2.5 rounded-xl border bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:border-transparent transition pr-10
                    {% if error %}border-red-400 focus:ring-red-400{% else %}border-gray-300 focus:ring-orange-400{% endif %}"
             {{ attrs }}>
      <button type="button" @click="show = !show"
              class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 rounded-lg flex items-center text-gray-400 hover:text-gray-600 transition focus:outline-none focus:ring-2 focus:ring-orange-400">
        <svg x-show="!show" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
        <svg x-show="show" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/>
        </svg>
      </button>
    </div>

  {% elif type == 'file' %}
    <label for="{{ name }}"
           class="flex items-center gap-3 px-4 py-2.5 rounded-xl border border-dashed hover:border-orange-500 focus-within:ring-2 focus-within:border-transparent bg-white cursor-pointer transition group
                  {% if error %}border-red-400 focus-within:ring-red-400{% else %}border-gray-300 focus-within:ring-orange-400{% endif %}">
      <svg class="w-5 h-5 text-gray-400 group-hover:text-orange-500 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
      </svg>
      <span class="text-sm text-gray-500 group-hover:text-gray-700">Choisir un fichier…</span>
      <input id="{{ name }}" name="{{ name }}" type="file"
             {% if required == 'true' %}required{% endif %}
             class="sr-only" {{ attrs }}>
    </label>

  {% else %}
    <input type="{{ type }}"
           id="{{ name }}"
           name="{{ name }}"
           placeholder="{{ placeholder }}"
           {% if value %}value="{{ value }}"{% endif %}
           {% if required == 'true' %}required{% endif %}
           class="w-full px-4 py-2.5 rounded-xl border bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:border-transparent transition
                  {% if error %}border-red-400 focus:ring-red-400{% else %}border-gray-300 focus:ring-orange-400{% endif %}"
           {{ attrs }}>
  {% endif %}

  {% if error %}
    <p class="text-xs text-red-500 mt-1">{{ error }}</p>
  {% endif %}
  {% if help_text %}
    <p class="text-xs text-gray-500 mt-1">{{ help_text }}</p>
  {% endif %}
</div>
