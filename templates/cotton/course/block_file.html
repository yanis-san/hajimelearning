<c-vars block="" />

{% if block.file_content %}
<div x-data="{ open: true }"
     @expand-all-blocks.window="open = true"
     @collapse-all-blocks.window="open = false"
     class="bg-gray-50 rounded-xl border border-gray-200 overflow-hidden" {{ attrs }}>

  <button x-on:click="open = !open"
          class="w-full flex items-center gap-3 px-5 py-4 text-left cursor-pointer group">
    <span class="flex items-center justify-center w-10 h-10 rounded-lg bg-orange-100 shrink-0">
      <svg class="w-5 h-5 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
      </svg>
    </span>
    <h4 class="flex-1 text-base font-semibold text-gray-800 group-hover:text-orange-600 transition">{{ block.title|default:"📎 Fichier" }}</h4>
    <svg class="w-4 h-4 text-gray-400 shrink-0 transition-transform duration-200"
         :class="open && 'rotate-180'"
         fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
    </svg>
  </button>

  <div x-show="open" x-collapse>
    <div class="px-5 pb-5">
      <div class="flex items-center justify-between gap-4 p-4 bg-orange-50 rounded-lg border border-orange-100">
        <div class="min-w-0">
          <p class="text-sm font-medium text-gray-700 truncate">{{ block.file_content.name }}</p>
          <span class="text-xs text-orange-600">Document à télécharger</span>
        </div>
        <c-ui.btn href="{{ block.file_content.url }}" variant="outline" size="sm" download class="shrink-0">
          <svg class="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          Télécharger
        </c-ui.btn>
      </div>
    </div>
  </div>

</div>
{% endif %}
