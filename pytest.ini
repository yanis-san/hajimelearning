[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
# On cherche les fichiers qui commencent par test_ ou finissent par _test
python_files = tests.py test_*.py *_tests.py
# Options par défaut (afficher les logs, arrêter au premier échec si voulu)
addopts = -v --nomigrations

markers =
    e2e: tests navigateur (Playwright) — nécessitent `playwright install chromium`
