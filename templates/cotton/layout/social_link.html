{# Pastille de réseau social (icône SVG en slot). #}
<c-vars href="" label="" />

<a href="{{ href }}" target="_blank" rel="noopener noreferrer" aria-label="{{ label }}"
   class="w-9 h-9 rounded-lg bg-gray-900 border border-gray-800 hover:border-gray-700 hover:bg-gray-800 text-gray-400 hover:text-white flex items-center justify-center transition-all hover:-translate-y-0.5" {{ attrs }}>
  {{ slot }}
</a>
