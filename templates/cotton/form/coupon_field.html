<c-vars course="" name="promo_code" />

<div x-data="{ applied: false }" class="space-y-2">
  <label class="block text-sm font-medium text-gray-700">Avez-vous un code promo ?</label>
  <div class="flex gap-2">
    <input type="text"
           name="{{ name }}"
           placeholder="Ex: PROMO20"
           :disabled="applied"
           :class="applied ? 'opacity-50 cursor-not-allowed' : ''"
           hx-post="{% url 'validate_coupon' course.id %}"
           hx-target="#price-result"
           hx-trigger="keyup delay:500ms changed"
           hx-include="[name=csrfmiddlewaretoken]"
           class="flex-1 px-4 py-2.5 rounded-xl border border-gray-300 bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-transparent transition text-sm">
  </div>
  <div id="price-result">
    {{ slot }}
  </div>
</div>
