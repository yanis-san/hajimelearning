{% load md %}
<c-vars block="" />

{% if block.file_content %}
<div x-data="collapsibleBlock"
     class="border border-gray-300 rounded-2xl bg-white shadow-soft overflow-hidden manga-drawn" {{ attrs }}>

  <button x-on:click="open = !open"
          class="w-full flex items-center justify-between px-5 py-4 text-left cursor-pointer transition-colors focus:outline-none select-none"
          :class="open ? 'bg-gray-50/70 border-b border-gray-200' : 'bg-white hover:bg-gray-50/60'">
    <div class="flex items-center gap-3.5 min-w-0 pr-3">
      <span class="flex items-center justify-center w-8 h-8 border border-gray-900 rounded-lg bg-purple-100 text-purple-700 text-sm font-bold shrink-0 shadow-xs">
        📎
      </span>
      <h3 class="text-base sm:text-lg font-bold text-gray-900 truncate">
        {{ block.title|furigana|default:"Fichier" }}
      </h3>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <span class="text-xs font-semibold text-gray-500 hidden sm:inline"
            x-text="open ? 'Replier' : 'Déplier'"></span>
      <div class="w-7 h-7 rounded-lg border border-gray-200 flex items-center justify-center bg-white text-gray-500">
        <svg class="w-4 h-4 transition-transform duration-200"
             :class="open && 'rotate-180'"
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>
    </div>
  </button>

  <div x-show="open" x-collapse>
    <div class="p-6 bg-white space-y-4">
      <div class="flex items-center justify-between gap-4 p-4 bg-gray-50 rounded-xl border border-gray-200">
        <div class="min-w-0">
          <p class="text-sm font-bold text-gray-900 truncate">{{ block.file_content.name }}</p>
          <span class="text-xs text-gray-500">Document ressource à télécharger</span>
        </div>
        <c-ui.btn href="{% url 'download_protected_media' block.id 'file_content' %}" variant="outline" size="sm" download class="shrink-0">
          <svg class="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          Télécharger
        </c-ui.btn>
      </div>

      {% if slot %}
        <div class="mt-6 pt-4 border-t border-gray-100">
          {{ slot }}
        </div>
      {% endif %}
    </div>
  </div>

</div>
{% endif %}
