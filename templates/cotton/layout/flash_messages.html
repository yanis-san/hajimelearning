{% if messages %}
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 space-y-2">
    {% for message in messages %}
      <div x-data="{ show: true }"
           x-show="show"
           x-init="setTimeout(() => show = false, 4000)"
           x-transition:leave="transition ease-in duration-300"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 -translate-y-2"
           class="flex items-start gap-3 p-4 rounded-xl border-l-4 shadow-sm
                  {% if message.tags == 'error' %}bg-red-50 border-red-500 text-red-800
                  {% elif message.tags == 'success' %}bg-green-50 border-green-500 text-green-800
                  {% elif message.tags == 'warning' %}bg-yellow-50 border-yellow-400 text-yellow-800
                  {% else %}bg-blue-50 border-blue-500 text-blue-800{% endif %}">

        <div class="shrink-0 mt-0.5">
          {% if message.tags == 'error' %}
            <svg class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          {% elif message.tags == 'success' %}
            <svg class="w-5 h-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          {% elif message.tags == 'warning' %}
            <svg class="w-5 h-5 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
          {% else %}
            <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          {% endif %}
        </div>

        <p class="flex-1 text-sm font-medium">{{ message }}</p>

        <button type="button" @click="show = false"
                class="shrink-0 ml-auto p-1 rounded-lg opacity-50 hover:opacity-100 transition-opacity focus:outline-none focus:ring-2 focus:ring-offset-1
                       {% if message.tags == 'error' %}focus:ring-red-400
                       {% elif message.tags == 'success' %}focus:ring-green-400
                       {% elif message.tags == 'warning' %}focus:ring-yellow-400
                       {% else %}focus:ring-blue-400{% endif %}">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
