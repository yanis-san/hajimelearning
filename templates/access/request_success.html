{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-16 text-center">
  <div class="text-5xl mb-4">✅</div>
  <h2 class="text-2xl font-bold text-gray-900 mb-3">Preuve envoyée !</h2>
  <p class="text-gray-600 mb-2">Merci ! Nous avons bien reçu votre reçu pour <span class="font-semibold text-gray-800">{{ course.title }}</span>.</p>
  <p class="text-gray-500 text-sm mb-8">L'accès sera débloqué sous 24h après validation.</p>
  <c-ui.btn variant="outline" href="{% url 'course_list' %}">
    Retour à l'accueil
  </c-ui.btn>
</div>
{% endblock %}
