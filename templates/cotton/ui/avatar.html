<c-vars user="" size="md" href="" />

{% if href %}
<a href="{{ href }}" class="block rounded-full shrink-0" {{ attrs }}>
{% endif %}

  {% if user.avatar %}
    <img src="{{ user.avatar.url }}"
         alt="{{ user.get_full_name|default:user.email }}"
         class="rounded-full object-cover border border-gray-200
                {% if size == 'sm' %}w-6 h-6
                {% elif size == 'lg' %}w-16 h-16
                {% elif size == 'xl' %}w-24 h-24
                {% else %}w-8 h-8{% endif %}">
  {% else %}
    <div class="rounded-full bg-orange-500 text-white flex items-center justify-center font-semibold select-none shrink-0
                {% if size == 'sm' %}w-6 h-6 text-xs
                {% elif size == 'lg' %}w-16 h-16 text-xl
                {% elif size == 'xl' %}w-24 h-24 text-3xl
                {% else %}w-8 h-8 text-sm{% endif %}">
      {{ user.first_name|first|default:user.email|first|upper }}
    </div>
  {% endif %}

{% if href %}
</a>
{% endif %}
