{% extends "base.html" %}

{% block title %}Mot de passe modifié — Hajime Learning{% endblock %}

{% block content %}
<c-layout.auth-card title="Mot de passe modifié" subtitle="Votre mot de passe a été changé avec succès.">

  <c-ui.alert variant="success">
    Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.
  </c-ui.alert>

  <div class="mt-6">
    <c-ui.btn href="{% url 'account_login' %}" block="true">Se connecter</c-ui.btn>
  </div>

</c-layout.auth-card>
{% endblock %}
