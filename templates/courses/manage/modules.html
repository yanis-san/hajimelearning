{% extends 'base.html' %}

{% block content %}
<c-layout.course_builder :course="course" active_tab="modules">

  {# ── Add module form ── #}
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 mb-8">
    <form hx-post="{% url 'manage_course_modules' course.slug %}"
          hx-target="#module-list"
          hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful) this.reset()"
          class="flex items-center gap-3">
      {% csrf_token %}
      <div class="flex-grow">
        {{ form.title }}
      </div>
      <c-ui.btn variant="primary" type="submit">
        ➕ Ajouter un module
      </c-ui.btn>
    </form>
  </div>

  {# ── Module list (sortable) ── #}
  <div class="sortable-list space-y-3" id="module-list"
       hx-post="{% url 'manage_module_reorder' course.slug %}"
       hx-trigger="end"
       hx-target="#reorder-msg">

    {% include 'courses/manage/partials/module_list.html' %}

  </div>

  <div id="reorder-msg"></div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script>
    htmx.onLoad(function(content) {
      const el = content.querySelector('#module-list') || document.getElementById('module-list');
      if (el && !el._sortable) {
        el._sortable = new Sortable(el, {
          animation: 200,
          handle: '.handle',
          ghostClass: 'bg-orange-50',
          onEnd() { htmx.trigger(el, 'end'); }
        });
      }
    });
  </script>

</c-layout.course_builder>
{% endblock %}
