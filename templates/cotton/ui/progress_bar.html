<c-vars percent="0" color="primary" size="" show_label="true" />

<div class="flex items-center gap-3" {{ attrs }}>
  <progress class="meter meter-{{ color }}{% if size %} meter-{{ size }}{% endif %} flex-1" value="{{ percent }}" max="100">{{ percent }}%</progress>
  {% if show_label == 'true' %}
    <span class="text-xs font-medium text-gray-500 w-9 text-right shrink-0">{{ percent }}%</span>
  {% endif %}
</div>
