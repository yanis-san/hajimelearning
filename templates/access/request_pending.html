{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-16 text-center">
  <div class="text-5xl mb-4">⏳</div>
  <h2 class="text-2xl font-bold text-gray-900 mb-3">Demande en cours</h2>
  <p class="text-gray-600 mb-2">Vous avez déjà envoyé une preuve pour le cours <span class="font-semibold text-gray-800">{{ course.title }}</span>.</p>
  <p class="text-gray-500 text-sm mb-8">Notre équipe est en train de la vérifier. Vous recevrez un email dès validation.</p>
  <c-ui.btn variant="outline" href="{% url 'course_list' %}">
    Retour à l'accueil
  </c-ui.btn>
</div>
{% endblock %}
