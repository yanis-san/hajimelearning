<c-vars module="" course="" />

<div id="module-item-{{ module.id }}"
     class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow-md transition group"
     x-data="{ editing: false, confirmDelete: false }">

  <input type="hidden" name="module_order" value="{{ module.id }}">

  <div class="flex items-center gap-4">

    {# Drag handle #}
    <div class="handle cursor-move flex items-center justify-center p-2 bg-gray-50 rounded-lg border border-gray-100 hover:bg-gray-100 transition text-gray-500 hover:text-gray-600 select-none shrink-0"
         title="Glisser pour déplacer">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/>
      </svg>
    </div>

    {# Module info #}
    <div class="flex-grow min-w-0">
      {# Display mode #}
      <div x-show="!editing" class="flex items-center gap-3">
        <div class="min-w-0 flex-grow">
          <div class="flex items-center gap-2">
            <h3 class="font-semibold text-gray-800 truncate">{{ module.title }}</h3>
            {% if not module.is_published %}
              <c-ui.badge variant="yellow">Brouillon</c-ui.badge>
            {% endif %}
          </div>
          <p class="text-xs text-gray-500 mt-0.5">{{ module.lessons.count }} leçon{{ module.lessons.count|pluralize }}</p>
        </div>
      </div>

      {# Edit mode (inline) #}
      <div x-show="editing" x-cloak>
        <form hx-post="{% url 'manage_module_edit' course.slug module.id %}"
              hx-target="#module-list"
              hx-swap="innerHTML"
              class="flex items-center gap-2">
          {% csrf_token %}
          <input type="text" name="title" value="{{ module.title }}"
                 class="flex-grow px-3 py-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-transparent"
                 x-ref="editInput"
                 x-on:keydown.escape="editing = false">
          <label class="flex items-center gap-1.5 text-sm text-gray-600">
            <input type="checkbox" name="is_published" {% if module.is_published %}checked{% endif %}
                   class="rounded border-gray-300 text-primary focus:ring-primary/40">
            Publié
          </label>
          <c-ui.btn variant="primary" size="sm" type="submit">
            Enregistrer
          </c-ui.btn>
          <button type="button" x-on:click="editing = false"
                  class="px-3 py-1.5 text-xs text-gray-600 hover:bg-gray-100 rounded-xl transition cursor-pointer">
            Annuler
          </button>
        </form>
      </div>
    </div>

    {# Actions #}
    <div x-show="!editing" class="flex items-center gap-2 shrink-0">
      <c-ui.btn variant="primary" size="sm" href="{% url 'manage_module_lessons' course.slug module.id %}">
        📖 Leçons
      </c-ui.btn>
      <button x-on:click="editing = true; $nextTick(() => $refs.editInput.focus())"
              class="p-1.5 rounded-lg text-gray-500 hover:text-primary hover:bg-primary/5 transition cursor-pointer"
              title="Renommer">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </button>

      {# Delete #}
      <div x-show="!confirmDelete">
        <button x-on:click="confirmDelete = true"
                class="p-1.5 rounded-lg text-gray-500 hover:text-red-500 hover:bg-red-50 transition cursor-pointer"
                title="Supprimer">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      </div>
      <div x-show="confirmDelete" x-cloak class="flex items-center gap-1">
        <span class="text-xs text-red-600 font-medium">Sûr ?</span>
        <button hx-post="{% url 'manage_module_delete' course.slug module.id %}"
                hx-target="#module-list"
                hx-swap="innerHTML"
                class="p-1 rounded bg-red-500 text-white text-xs hover:bg-red-600 transition cursor-pointer">
          Oui
        </button>
        <button x-on:click="confirmDelete = false"
                class="p-1 rounded bg-gray-200 text-gray-600 text-xs hover:bg-gray-300 transition cursor-pointer">
          Non
        </button>
      </div>
    </div>
  </div>
</div>
