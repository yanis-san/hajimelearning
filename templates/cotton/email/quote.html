{# Encadré pour citer un message (question, réponse, note de l'administrateur). #}
<c-vars label="" />

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;">
  <tr>
    <td style="background-color:#f9fafb;border-left:4px solid #e6003a;border-radius:6px;padding:14px 16px;font-size:15px;line-height:1.6;color:#374151;">
      {% if label %}<span style="display:block;margin-bottom:6px;font-size:12px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:#6b7280;">{{ label }}</span>{% endif %}
      {{ slot }}
    </td>
  </tr>
</table>
