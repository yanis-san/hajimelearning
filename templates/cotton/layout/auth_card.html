<c-vars title="" subtitle="" />

<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12 bg-gray-50">
  <div class="w-full max-w-md">

    {# Logo / Marque #}
    <div class="text-center mb-8">
      <a href="{% url 'course_list' %}" class="inline-flex items-center gap-2 text-orange-500 font-bold text-xl">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
        Hajime Learning
      </a>
    </div>

    {# Carte #}
    <div class="bg-white border border-gray-100 rounded-2xl shadow-sm px-8 py-10">

      {% if title %}
        <div class="mb-7">
          <h1 class="text-xl font-semibold text-gray-900">{{ title }}</h1>
          {% if subtitle %}
            <p class="text-sm text-gray-500 mt-1">{{ subtitle }}</p>
          {% endif %}
        </div>
      {% endif %}

      {{ slot }}

    </div>

  </div>
</div>
