{# En-tête #}
<div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 bg-gray-50/60">
  <h3 class="text-sm font-semibold text-gray-800">Notifications</h3>
  <a href="{% url 'my_notifications' %}" class="text-xs text-orange-500 hover:text-orange-700 font-medium transition">
    Tout voir
  </a>
</div>

{# Liste #}
<div class="max-h-80 overflow-y-auto divide-y divide-gray-100">
  {% if notifications %}
    {% for notif in notifications %}
      <div id="notif-item-{{ notif.id }}"
           class="px-4 py-3 hover:bg-gray-50 border-b border-gray-100 last:border-0 transition-colors
                  {% if not notif.is_read %}bg-orange-50/40{% endif %}">
        <a href="{% url 'mark_read_and_redirect' notif.id %}" class="block">
          <p class="text-sm font-medium text-gray-800 truncate">{{ notif.title|default:"Notification" }}</p>
          <p class="text-xs text-gray-500 mt-0.5 line-clamp-2">{{ notif.message }}</p>
          <p class="text-xs text-gray-400 mt-1">{{ notif.created_at|timesince }}</p>
        </a>
        <button type="button"
                hx-post="{% url 'mark_notif_read' notif.id %}"
                hx-target="#notif-item-{{ notif.id }}"
                hx-swap="outerHTML"
                class="mt-1 text-xs font-medium cursor-pointer transition-colors
                       {% if not notif.is_read %}text-orange-500 hover:text-orange-700{% else %}text-gray-400 hover:text-gray-600{% endif %}">
          {% if not notif.is_read %}Marquer comme lu{% else %}Marquer comme non lu{% endif %}
        </button>
      </div>
    {% endfor %}
  {% else %}
    <div class="px-4 py-10 text-center">
      <svg class="w-8 h-8 text-gray-300 mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
      </svg>
      <p class="text-sm text-gray-400">Aucune notification</p>
    </div>
  {% endif %}
</div>
