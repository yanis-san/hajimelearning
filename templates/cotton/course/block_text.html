{% load md %}
<c-vars block="" />

<c-course.block-frame icon="📝" tone="yellow">
  <c-slot name="title">{% if block.title %}{{ block.title|furigana }}{% else %}{{ block.text_content|first_heading|furigana }}{% endif %}</c-slot>
  <c-slot name="footer">{{ slot }}</c-slot>
    <div class="p-6 bg-white">
      <div class="prose prose-gray max-w-none prose-headings:text-gray-900 prose-a:text-primary prose-a:no-underline hover:prose-a:underline prose-img:rounded-xl">
        {% if block.title %}
          {{ block.text_content|md }}
        {% else %}
          {{ block.text_content|strip_first_heading|md }}
        {% endif %}
      </div>
    </div>
  
</c-course.block-frame>
