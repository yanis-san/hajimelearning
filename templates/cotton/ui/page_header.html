<c-vars title="" subtitle="" />

<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-10 pb-6 border-b-4 border-dark" {{ attrs }}>
  <div>
    <h1 class="text-4xl font-black text-dark uppercase tracking-tight italic">{{ title }}</h1>
    {% if subtitle %}
      <p class="mt-2 text-sm font-bold text-gray-500 uppercase tracking-widest">{{ subtitle }}</p>
    {% endif %}
  </div>
  {% if slot %}
    <div class="flex items-center gap-4 shrink-0">{{ slot }}</div>
  {% endif %}
</div>
