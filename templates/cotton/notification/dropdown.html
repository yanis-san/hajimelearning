<c-vars notifications="" unread_count="0" />

<div x-data="{ notifOpen: false }" class="relative" {{ attrs }}>

  {# Bouton cloche #}
  <button @click="notifOpen = !notifOpen"
          class="relative p-2 bg-white border-2 border-gray-200 rounded-xl hover:border-gray-900 shadow-sm hover:shadow-[2px_2px_0_0_#111827] hover:-translate-y-0.5 transition-all focus:outline-none cursor-pointer">
    <svg class="w-6 h-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
    </svg>
    <div id="notification-badge">
      {% if unread_count > 0 %}
        <span class="absolute -top-1 -right-1 inline-flex items-center justify-center min-w-[1.2rem] h-5 px-1 text-xs font-bold text-white bg-primary rounded-full border-2 border-white shadow-sm">
          {{ unread_count }}
        </span>
      {% endif %}
    </div>
  </button>

  {# Dropdown panel #}
  <div x-show="notifOpen"
       @click.outside="notifOpen = false"
       x-transition:enter="transition ease-out duration-150"
       x-transition:enter-start="opacity-0 scale-95 translate-y-2"
       x-transition:enter-end="opacity-100 scale-100 translate-y-0"
       x-transition:leave="transition ease-in duration-100"
       x-transition:leave-start="opacity-100 scale-100 translate-y-0"
       x-transition:leave-end="opacity-0 scale-95 translate-y-2"
       x-cloak
       class="absolute right-0 mt-3 w-80 bg-white border-2 border-gray-900 rounded-xl shadow-[4px_4px_0_0_#111827] z-50 origin-top-right overflow-hidden"
       id="notification-dropdown-panel">

    {# En-tête #}
    <div class="bg-gray-50 border-b-2 border-gray-200 px-4 py-3 flex justify-between items-center">
      <span class="text-sm font-bold text-gray-900">Notifications</span>
      <a href="{% url 'my_notifications' %}" class="text-xs font-bold text-primary hover:text-white border-2 border-transparent hover:border-gray-900 hover:bg-primary rounded-lg px-2 py-1 transition-all">
        Tout voir
      </a>
    </div>

    {# Liste #}
    <div class="max-h-80 overflow-y-auto bg-white divide-y-2 divide-gray-100">
      {% if notifications %}
        {% for notif in notifications %}
          <c-notification.item :notif="notif" compact="true" />
        {% endfor %}
      {% else %}
        <div class="px-4 py-10 text-center bg-white border-b-2 border-gray-100">
          <div class="w-12 h-12 border-2 border-gray-200 rounded-xl mx-auto mb-3 flex items-center justify-center bg-gray-50 text-gray-400">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
          </div>
          <p class="text-sm font-bold text-gray-500">Aucune notification</p>
        </div>
      {% endif %}
    </div>

    {# Pied de dropdown — action "tout lire" #}
    {% if unread_count > 0 %}
      <div class="bg-gray-50 p-3 border-t-2 border-gray-200">
        <button type="button"
                hx-post="{% url 'mark_all_read' %}"
                hx-headers='{"X-Source": "dropdown"}'
                hx-target="#notification-dropdown-panel"
                hx-swap="innerHTML"
                class="w-full block text-center text-sm font-bold text-gray-900 bg-white border-2 border-gray-900 rounded-lg shadow-[2px_2px_0_0_#111827] hover:shadow-[3px_3px_0_0_#111827] hover:-translate-y-0.5 py-2 transition-all cursor-pointer">
          Tout marquer comme lu
        </button>
      </div>
    {% endif %}
  </div>
</div>
