{% extends 'base.html' %}

{% block title %}Mes cours | Hajime Learning{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

  <c-ui.page-header title="Mes cours" subtitle="Retrouvez vos formations et suivez votre progression." />

  {% if courses %}
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      {% for course in courses %}
        <c-course.card :course="course" show_progress="true" />
      {% endfor %}
    </div>
  {% else %}
    <c-ui.empty-state
      icon='<svg class="w-16 h-16 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>'
      title="Aucun cours pour le moment"
      message="Vous n'êtes inscrit à aucune formation. Explorez notre catalogue pour commencer votre apprentissage.">
      <c-ui.btn href="{% url 'course_list' %}" variant="primary">
        Voir le catalogue
      </c-ui.btn>
    </c-ui.empty-state>
  {% endif %}

</div>
{% endblock %}
