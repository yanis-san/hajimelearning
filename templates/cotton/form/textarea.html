<c-vars name="" label="" placeholder="" value="" error="" rows="4" required="false" />

<div class="space-y-1">
  {% if label %}
    <label for="{{ name }}" class="block text-sm font-medium text-gray-700">
      {{ label }}{% if required == 'true' %}<span class="text-red-500 ml-0.5">*</span>{% endif %}
    </label>
  {% endif %}

  <textarea id="{{ name }}"
            name="{{ name }}"
            rows="{{ rows }}"
            placeholder="{{ placeholder }}"
            {% if required == 'true' %}required{% endif %}
            class="w-full px-4 py-2.5 rounded-xl border bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:border-transparent transition resize-y
                   {% if error %}border-red-400 focus:ring-red-400{% else %}border-gray-300 focus:ring-orange-400{% endif %}"
            {{ attrs }}>{{ value }}</textarea>

  {% if error %}
    <p class="text-xs text-red-500 mt-1">{{ error }}</p>
  {% endif %}
</div>
