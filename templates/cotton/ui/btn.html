{# Bouton ou lien-bouton. Convention de couleurs : voir static/css/app/buttons.css #}
<c-vars variant="primary" href="" type="button" size="md" disabled="false" block="false" icon="false" class="" />

{% if href %}
<a href="{{ href }}"
   class="btn btn-{{ variant }} btn-{{ size }}{% if block == 'true' %} btn-block{% endif %}{% if icon == 'true' %} btn-icon{% endif %} manga-drawn {{ class }}"
   {% if disabled == 'true' %}aria-disabled="true"{% endif %}
   {{ attrs }}>{{ slot }}</a>
{% else %}
<button type="{{ type }}"
        class="btn btn-{{ variant }} btn-{{ size }}{% if block == 'true' %} btn-block{% endif %}{% if icon == 'true' %} btn-icon{% endif %} manga-drawn {{ class }}"
        {% if disabled == 'true' %}disabled{% endif %}
        {{ attrs }}>{{ slot }}</button>
{% endif %}
