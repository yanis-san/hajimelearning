<c-vars name="" label="" placeholder="" value="" error="" rows="4" required="false" help_text="" />

<div class="space-y-1">
  {% if label %}
    <label for="{{ name }}" class="block text-sm font-black uppercase tracking-widest text-dark">
      {{ label }}{% if required == 'true' %}<span class="text-primary ml-1">*</span>{% endif %}
    </label>
  {% endif %}

  <textarea id="{{ name }}"
            name="{{ name }}"
            rows="{{ rows }}"
            placeholder="{{ placeholder }}"
            {% if required == 'true' %}required{% endif %}
            class="w-full px-4 py-3 border-2 text-dark placeholder-gray-500 bg-white focus:outline-none focus:ring-0 transition-all resize-y
                   {% if error %}border-primary focus:shadow-[4px_4px_0_0_#E6003A]{% else %}border-dark focus:shadow-brutal-md hover:-translate-y-0.5 hover:shadow-brutal-md{% endif %}"
            {{ attrs }}>{{ value }}</textarea>

  {% if help_text and not error %}
    <p class="text-xs text-gray-500 font-medium mt-1">{{ help_text }}</p>
  {% endif %}

  {% if error %}
    <p class="text-xs font-bold text-primary mt-1 uppercase tracking-wide flex items-center gap-1">
        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
        {{ error }}
    </p>
  {% endif %}
</div>
