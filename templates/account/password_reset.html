{% extends "base.html" %}

{% block title %}Mot de passe oublié — Hajime Learning{% endblock %}

{% block content %}
<c-layout.auth-card title="Mot de passe oublié" subtitle="Entrez votre adresse email. Nous vous enverrons un lien sécurisé.">

  <form method="POST" action="{% url 'account_reset_password' %}" class="space-y-4">
    {% csrf_token %}

    <c-form.input name="email" type="email" label="Adresse e-mail"
      placeholder="mon.email@exemple.com"
      :value="form.email.value|default:''"
      :error="form.email.errors.0" required="true" />

    <div class="pt-2">
      <c-ui.btn type="submit" block="true">Envoyer le lien</c-ui.btn>
    </div>
  </form>

  <p class="mt-6 text-center text-sm text-gray-500 border-t border-gray-100 pt-6">
    <a href="{% url 'account_login' %}" class="text-primary hover:text-primary-dark font-medium">← Retour à la connexion</a>
  </p>

</c-layout.auth-card>
{% endblock %}
