{% extends "base.html" %}

{% block title %}Email envoyé — Hajime Learning{% endblock %}

{% block content %}
<c-layout.auth-card title="Email envoyé" subtitle="Vérifiez votre boîte de réception.">

  <c-ui.alert variant="success">
    Si un compte existe avec cet email, vous recevrez un lien pour créer un nouveau mot de passe.
    Pensez à vérifier vos spams.
  </c-ui.alert>

  <div class="mt-6">
    <c-ui.btn href="{% url 'course_list' %}" variant="outline" class="w-full justify-center">
      Retour à l'accueil
    </c-ui.btn>
  </div>

</c-layout.auth-card>
{% endblock %}
