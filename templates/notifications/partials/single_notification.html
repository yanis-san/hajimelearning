<div id="notif-item-{{ notif.id }}"
     class="flex items-start gap-3 p-4 border-b border-gray-100 last:border-0 transition
            {% if notif.category == 'support' %}
              {% if not notif.is_read %}bg-green-50{% else %}bg-green-50/60{% endif %}
            {% else %}
              {% if not notif.is_read %}bg-primary/5{% else %}bg-white{% endif %}
            {% endif %}">

  {# Indicateur lu / non lu (purement visuel, pas de double clic) #}
  <div class="shrink-0 mt-1 p-1">
    {% if not notif.is_read %}
      <span class="block h-2.5 w-2.5 rounded-full shadow-sm
                   {% if notif.category == 'support' %}bg-green-500{% else %}bg-primary{% endif %}"></span>
    {% else %}
      <span class="block h-2.5 w-2.5 border-2 border-gray-300 rounded-full"></span>
    {% endif %}
  </div>

  {# Contenu cliquable #}
  <div class="flex-1 min-w-0">
    <a href="{% url 'mark_read_and_redirect' notif.id %}" class="group">
      <p class="text-sm font-medium text-gray-800 group-hover:text-primary transition-colors truncate">
        {{ notif.title|default:"Notification" }}
      </p>
      <p class="text-xs text-gray-500 mt-0.5 line-clamp-2">{{ notif.message }}</p>
    </a>
    {# Bouton marquer comme lu/non lu #}
    <button type="button"
            hx-post="{% url 'mark_notif_read' notif.id %}"
            hx-target="#notif-item-{{ notif.id }}"
            hx-swap="outerHTML"
            class="mt-1.5 text-xs font-bold cursor-pointer transition-colors
                   {% if not notif.is_read %}text-primary hover:brightness-95{% else %}text-gray-400 hover:text-gray-600{% endif %}">
      {% if not notif.is_read %}Marquer comme lu{% else %}Marquer comme non lu{% endif %}
    </button>
  </div>

  {# Date #}
  <span class="shrink-0 text-xs text-gray-400 whitespace-nowrap mt-1">{{ notif.created_at|timesince }}</span>
</div>
