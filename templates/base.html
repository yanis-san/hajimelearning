{% load static %}
<!DOCTYPE html>
<html lang="fr" class="min-h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FAF8F5">

    <title>{% block title %}Hajime Learning - Apprenez en ligne{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}La meilleure plateforme de formation en Algérie.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}formation, ligne, algérie, cours, python, dev{% endblock %}">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}Hajime Learning{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Formez-vous dès aujourd'hui.{% endblock %}">
    {% block og_image %}{# <meta property="og:image" content="{% static 'img/og-default.jpg' %}"> #}{% endblock %}
    <meta property="og:url" content="{{ request.build_absolute_uri }}">

    <link rel="icon" type="image/png" href="{% static 'img/hanko_round.png' %}">
    <link href="{% static 'css/dist/styles.css' %}" rel="stylesheet">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">

    <script src="{% static 'js/vendor/htmx.min.js' %}"></script>
    <script defer src="{% static 'js/components/autoplay-video.js' %}"></script>
    <script defer src="{% static 'js/components/block-note.js' %}"></script>
    <script defer src="{% static 'js/components/catalogue-filters.js' %}"></script>
    <script defer src="{% static 'js/components/collapsible-block.js' %}"></script>
    <script defer src="{% static 'js/components/builder-status.js' %}"></script>
    <script defer src="{% static 'js/components/course-form.js' %}"></script>
    <script defer src="{% static 'js/components/furigana-guide.js' %}"></script>
    <script defer src="{% static 'js/components/lesson-completion.js' %}"></script>
    <script defer src="{% static 'js/components/persist-scroll.js' %}"></script>
    <script defer src="{% static 'js/components/quiz.js' %}"></script>
    <script defer src="{% static 'js/components/support-hub.js' %}"></script>
    {# Alpine démarre après l'enregistrement des composants ci-dessus #}
    <script defer src="{% static 'js/vendor/alpine.min.js' %}"></script>


    {% block extra_head %}{% endblock %}
</head>

<body class="min-h-screen flex flex-col font-sans text-dark antialiased"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <c-layout.navbar />

    <c-layout.flash-messages />

    <main class="flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <c-layout.footer />

    {% block extra_js %}{% endblock %}
</body>
</html>
