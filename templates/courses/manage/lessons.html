{% extends 'base.html' %}

{% block content %}
<c-layout.course_builder :course="course" active_tab="modules">

  {# ── Add lesson form ── #}
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 mb-8">
    <form hx-post="{% url 'manage_module_lessons' course.slug module.id %}"
          hx-target="#lesson-list"
          hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful) this.reset()"
          class="flex items-center gap-3 flex-wrap">
      {% csrf_token %}
      <div class="flex-grow min-w-[200px]">
        {{ form.title }}
      </div>
      <div class="w-48">
        {{ form.slug }}
      </div>
      <label class="flex items-center gap-1.5 text-sm text-gray-600">
        {{ form.is_free }}
        Gratuit
      </label>
      <c-ui.btn variant="primary" type="submit">
        ➕ Ajouter une leçon
      </c-ui.btn>
    </form>
  </div>

  {# ── Lesson list (sortable) ── #}
  <div class="sortable-list space-y-3" id="lesson-list"
       hx-post="{% url 'manage_lesson_reorder' course.slug module.id %}"
       hx-trigger="end"
       hx-target="#reorder-msg">

    {% include 'courses/manage/partials/lesson_list.html' %}

  </div>

  <div id="reorder-msg"></div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script>
    htmx.onLoad(function(content) {
      const el = content.querySelector('#lesson-list') || document.getElementById('lesson-list');
      if (el && !el._sortable) {
        el._sortable = new Sortable(el, {
          animation: 200,
          handle: '.handle',
          ghostClass: 'bg-orange-50',
          onEnd() { htmx.trigger(el, 'end'); }
        });
      }
    });
  </script>

</c-layout.course_builder>
{% endblock %}
