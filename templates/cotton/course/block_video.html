<c-vars block="" />

<div x-data="{ open: true }"
     @expand-all-blocks.window="open = true"
     @collapse-all-blocks.window="open = false" {{ attrs }}>
  <button x-on:click="open = !open"
          class="w-full flex items-center justify-between py-2 text-left cursor-pointer group">
    <h3 class="text-lg font-semibold text-gray-800 group-hover:text-orange-600 transition">{{ block.title|default:"🎬 Vidéo" }}</h3>
    <svg class="w-4 h-4 text-gray-400 shrink-0 transition-transform duration-200"
         :class="open && 'rotate-180'"
         fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
    </svg>
  </button>
  <div x-show="open" x-collapse>
    <div class="max-w-3xl mt-2">
      <div class="bg-black rounded-xl overflow-hidden shadow-sm aspect-video">
        <iframe src="https://www.youtube.com/embed/{{ block.video_id }}"
                class="w-full h-full border-0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                loading="lazy"
                allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>
</div>
