<c-vars icon="📭" title="Rien ici" message="" />

<div class="flex flex-col items-center justify-center py-16 px-4 text-center" {{ attrs }}>
  <div class="text-5xl mb-4 select-none">{{ icon|safe }}</div>
  <h3 class="text-lg font-semibold text-gray-800 mb-2">{{ title }}</h3>
  {% if message %}
    <p class="text-sm text-gray-500 max-w-sm mb-6">{{ message }}</p>
  {% endif %}
  {% if slot %}
    <div class="mt-2">{{ slot }}</div>
  {% endif %}
</div>
