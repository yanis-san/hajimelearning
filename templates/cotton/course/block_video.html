{% load md %}
<c-vars block="" />

<div x-data="{ open: true }"
     @expand-all-blocks.window="open = true"
     @collapse-all-blocks.window="open = false"
     class="border border-gray-300 rounded-2xl bg-white shadow-[2px_2px_0_0_rgba(17,24,39,0.08)] overflow-hidden manga-drawn" {{ attrs }}>

  {# ── Header cliquable ── #}
  <button x-on:click="open = !open"
          class="w-full flex items-center justify-between px-5 py-4 text-left cursor-pointer transition-colors focus:outline-none select-none"
          :class="open ? 'bg-gray-50/70 border-b border-gray-200' : 'bg-white hover:bg-gray-50/60'">
    <div class="flex items-center gap-3.5 min-w-0 pr-3">
      <span class="flex items-center justify-center w-8 h-8 border border-gray-900 rounded-lg bg-red-100 text-red-600 text-sm font-bold shrink-0 shadow-xs">
        🎬
      </span>
      <h3 class="text-base sm:text-lg font-bold text-gray-900 truncate">
        {{ block.title|furigana|default:"Vidéo" }}
      </h3>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <span class="text-xs font-semibold text-gray-400 hidden sm:inline"
            x-text="open ? 'Replier' : 'Déplier'"></span>
      <div class="w-7 h-7 rounded-lg border border-gray-200 flex items-center justify-center bg-white text-gray-500">
        <svg class="w-4 h-4 transition-transform duration-200"
             :class="open && 'rotate-180'"
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>
    </div>
  </button>

  {# ── Contenu du bloc ── #}
  <div x-show="open" x-collapse>
    <div class="p-6 bg-white space-y-4">
      <div class="bg-black rounded-xl overflow-hidden shadow-sm aspect-video w-full max-w-4xl mx-auto">
        <iframe src="https://www.youtube.com/embed/{{ block.video_id }}"
                class="w-full h-full border-0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                loading="lazy"
                allowfullscreen>
        </iframe>
      </div>

      {% if slot %}
        <div class="mt-6 pt-4 border-t border-gray-100">
          {{ slot }}
        </div>
      {% endif %}
    </div>
  </div>

</div>
