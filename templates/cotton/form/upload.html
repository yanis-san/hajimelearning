{# Zone de dépôt d'image : libellé, aperçu de l'image actuelle, champ fichier, erreur ou aide. #}
<c-vars field label="" icon="" current="" alt="" hint="" />

<div class="bg-stone-50/70 border-2 border-dashed border-gray-300 rounded-2xl p-5 space-y-3" {{ attrs }}>
  <div class="flex items-center justify-between">
    <label class="block text-xs font-black uppercase tracking-wider text-gray-800">{{ icon }} {{ label }}</label>
  </div>

  {% if current %}
    <c-ui.card padding="none" class="relative overflow-hidden max-w-[220px]">
      <img src="{{ current.url }}" alt="{{ alt }}" class="w-full h-32 object-cover">
      <span class="absolute bottom-1 right-1 px-1.5 py-0.5 text-[10px] font-bold bg-gray-900/80 text-white rounded">Actuelle</span>
    </c-ui.card>
  {% endif %}

  <div>
    {{ field }}
    {% if field.errors %}
      <c-form.error>{{ field.errors.0 }}</c-form.error>
    {% elif hint %}
      <c-form.hint class="mt-1.5">{{ hint }}</c-form.hint>
    {% endif %}
  </div>
</div>
