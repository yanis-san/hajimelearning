<section class="bg-primary text-white py-24 border-b-2 border-primary-dark relative overflow-hidden">

        <h2 class="text-4xl md:text-6xl font-extrabold tracking-tight italic mb-6 drop-shadow-sm">

        </p>

      </c-ui.btn>
